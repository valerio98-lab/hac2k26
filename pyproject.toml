[project]
name = "hac2k26"
version = "0.1.0"
description = "Humanoid application"
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.10,<3.14"
license-files = ["LICENSE"]
authors = [
  { name = "Valerio Belli" },
]
dependencies = [
    "mjlab[cu128]",
    "robot-descriptions>=2.0.0",
    "torch>=2.7.0,<2.10.0",
]

[project.scripts]
train = "mjlab.scripts.train:main"
play = "mjlab.scripts.play:main"

[build-system]
requires = ["uv_build>=0.8.18,<0.9.0"]
build-backend = "uv_build"

[tool.uv.sources]
mjlab = { git = "https://github.com/mujocolab/mjlab", rev = "f7fdb163b590e980865e59a5633ff5e1143553bd" }
warp-lang = { index = "nvidia", marker = "sys_platform != 'darwin'" }
torch = [
  { index = "pytorch-cu128", marker = "sys_platform != 'darwin'" },
]
mujoco = { index = "mujoco" }
mujoco-warp = { git = "https://github.com/google-deepmind/mujoco_warp", rev = "875c4caf06d71b12b2036c327e7a07ce08a78b9a" }

[[tool.uv.index]]
url = "https://pypi.org/simple"

[[tool.uv.index]]
name = "nvidia"
url = "https://pypi.nvidia.com/"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[[tool.uv.index]]
name = "mujoco"
url = "https://py.mujoco.org"
explicit = true

# The nightly index (py.mujoco.org) only has dev builds.
[tool.uv]
override-dependencies = ["mujoco>=3.6.0.dev0"]

[tool.ruff]
indent-width = 2
src = ["src/hac2k26"]
exclude = ["typings"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]

[tool.pyright]
pythonVersion = "3.13"
ignore = ["./typings"]
stubPath = "typings"
reportWildcardImportFromLibrary = false

[dependency-groups]
dev = [
    "pyright>=1.1.408",
    "pytest>=9.0.2",
    "ruff>=0.14.14",
    "ty>=0.0.14",
]

[project.entry-points."mjlab.tasks"]
hac2k26 = "hac2k26"
